name: Android Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build APK and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Verify offline voice assets
        run: node scripts/generate-voice-assets.mjs --check

      - name: Resolve release tag
        id: release
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            VERSION=$(node -p "require('./package.json').version")
            TAG="v$VERSION"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "apk=Darino-$TAG.apk" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Restore signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is not configured"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/darino-release.keystore"
          echo "DARINO_KEYSTORE_PATH=$RUNNER_TEMP/darino-release.keystore" >> "$GITHUB_ENV"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build release APK
        env:
          DARINO_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          DARINO_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          DARINO_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false'
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APKs
        run: |
          TAG="${{ steps.release.outputs.tag }}"
          cd android/app/build/outputs/apk/release
          for file in app-*-release.apk; do
            abi="${file#app-}"
            abi="${abi%-release.apk}"
            cp "$file" "$GITHUB_WORKSPACE/Darino-${TAG}-${abi}.apk"
          done
          cd "$GITHUB_WORKSPACE"
          ls -lh Darino-*.apk
          LIMIT=$((25 * 1024 * 1024))
          ARM64=$(stat -c%s "Darino-${TAG}-arm64-v8a.apk")
          echo "arm64 APK: $((ARM64 / 1024 / 1024)) MB"
          if [ "$ARM64" -gt "$LIMIT" ]; then
            echo "::warning::arm64 APK is larger than the 25 MB budget ($((ARM64 / 1024 / 1024)) MB)"
          fi

      - name: Verify APK signatures
        run: |
          set -o pipefail
          # Trust anchor: SHA-256 of the release signing certificate. A debug-signed APK uploads
          # fine and only breaks on the user's phone, so this fails the release instead.
          EXPECTED_SHA256="e52b21e851e673453363bb10fe0b401e5af37a31747807017670975fb12f9deb"
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "apksigner: $BUILD_TOOLS/apksigner"
          fail=0
          for apk in Darino-*.apk; do
            echo "== $apk"
            OUT=$("$BUILD_TOOLS/apksigner" verify --print-certs "$apk") || fail=1
            echo "$OUT" | head -6
            got=$(printf '%s\n' "$OUT" | grep -iE 'certificate sha-256 digest' | head -1 | sed 's/.*digest: *//' | tr -d ' \r:' | tr 'A-Z' 'a-z')
            if [ -z "$got" ]; then
              echo "::error::$apk: no signing certificate digest in apksigner output"
              fail=1
            elif [ "$got" != "$EXPECTED_SHA256" ]; then
              echo "::error::$apk is signed by $got, expected the release key $EXPECTED_SHA256"
              fail=1
            else
              echo "signature ok: release key $got"
            fi
          done
          exit $fail

      - name: Render release notes
        run: |
          sed "s/{{TAG}}/${{ steps.release.outputs.tag }}/g" .github/release-body.md > "$RUNNER_TEMP/release-body.md"
          head -5 "$RUNNER_TEMP/release-body.md"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: Darino ${{ steps.release.outputs.tag }}
          body_path: ${{ runner.temp }}/release-body.md
          files: Darino-*.apk
          draft: false
          prerelease: false
